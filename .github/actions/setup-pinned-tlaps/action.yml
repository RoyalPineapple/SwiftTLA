name: Set up source-pinned TLAPS
description: Build or restore the exact proof manager and backends without rolling-release downloads
inputs:
  evidence:
    description: Directory for the retained toolchain receipt
    required: true
outputs:
  directory:
    description: Directory containing tlapm/bin/tlapm
    value: ${{ steps.inputs.outputs.directory }}
runs:
  using: composite
  steps:
    - name: Validate immutable build inputs
      id: inputs
      shell: bash
      env:
        PROOF_EVIDENCE: ${{ inputs.evidence }}
      run: |
        set -euo pipefail
        pin=$(python3 scripts/verify-tlaps-build-inputs.py Verification/Semantics/proof-toolchain.json Tools/TLAPS/packaging.patch)
        mkdir -p "$PROOF_EVIDENCE/build-inputs"
        cp Verification/Semantics/proof-toolchain.json Tools/TLAPS/packaging.patch "$PROOF_EVIDENCE/build-inputs/"
        git rev-parse HEAD > "$PROOF_EVIDENCE/source-sha.txt"
        echo "source=$(jq -r .sourceCommit <<< "$pin")" >> "$GITHUB_OUTPUT"
        echo "ocaml=$(jq -r .ocamlCompiler <<< "$pin")" >> "$GITHUB_OUTPUT"
        echo "opam=$(jq -r .opamRepositoryCommit <<< "$pin")" >> "$GITHUB_OUTPUT"
        echo "directory=$GITHUB_WORKSPACE/.build/pinned-tlaps" >> "$GITHUB_OUTPUT"
        host=$(printf '%s\n' "${ImageOS:-}" "${ImageVersion:-}" "$(uname -sm)" "$(cc --version)" | shasum -a 256 | awk '{print $1}')
        echo "host=$host" >> "$GITHUB_OUTPUT"
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      id: cache
      with:
        path: .build/pinned-tlaps
        key: proof-source-${{ runner.os }}-${{ runner.arch }}-${{ steps.inputs.outputs.host }}-${{ hashFiles('Verification/Semantics/proof-toolchain.json', 'Tools/TLAPS/packaging.patch', 'scripts/build-pinned-tlaps.sh', 'scripts/verify-tlaps-build-inputs.py', '.github/actions/setup-pinned-tlaps/action.yml') }}
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        repository: tlaplus/tlapm
        ref: ${{ steps.inputs.outputs.source }}
        path: .build/tlaps-source
        persist-credentials: false
    - uses: ocaml/setup-ocaml@ff66428f72b64472e749b22e0ad4dded4b2ddca6 # v3
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        ocaml-compiler: ${{ steps.inputs.outputs.ocaml }}
        opam-repositories: |
          default: https://github.com/ocaml/opam-repository.git#${{ steps.inputs.outputs.opam }}
        opam-pin: false
        opam-disable-sandboxing: true
        cache-prefix: proof-${{ steps.inputs.outputs.opam }}
    - name: Install build prerequisites
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        if [ "$(uname -s)" = Linux ]; then
          sudo apt-get update
          sudo apt-get install --yes zlib1g-dev gawk time wget unzip patch
        elif ! command -v wget >/dev/null; then
          brew install wget
        fi
    - name: Build or verify the pinned proof tool
      shell: bash
      env:
        PROOF_CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        PROOF_EVIDENCE: ${{ inputs.evidence }}
      run: bash scripts/build-pinned-tlaps.sh
    - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      if: steps.cache.outputs.cache-hit != 'true'
      with:
        path: .build/pinned-tlaps
        key: ${{ steps.cache.outputs.cache-primary-key }}
