name: Public Workflow Conformance

on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-head:
    runs-on: ubuntu-latest
    outputs:
      run_expensive: ${{ steps.head.outputs.run_expensive }}
    steps:
      - id: head
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run_expensive', 'true')
              return
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'public-workflow-conformance.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            })
            const previous = data.workflow_runs[0]
            core.setOutput('run_expensive', String(!previous || previous.head_sha !== context.sha))

  public-workflow-conformance:
    needs: check-head
    if: needs.check-head.outputs.run_expensive == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Check aggregate workflow contract
        run: bash Tests/Fixtures/PublicWorkflowConformance/CI/assert_workflow.sh

      - name: Provision pinned TLC graph tools
        run: scripts/setup-core-conformance-tools.sh --tool-root "$GITHUB_WORKSPACE/.build/core-conformance-tools" --cases Verification/CoreConformance/cases.json

      - name: Run correlated public-workflow validation
        run: |
          scripts/run_public_workflow_support_gate.sh --hosted-ci \
            --output ".build/public-workflow-ci/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Upload aggregate public-workflow evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-workflow-evidence-${{ github.run_id }}
          path: .build/public-workflow-ci
          if-no-files-found: error
