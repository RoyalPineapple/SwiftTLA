name: EWD998 Trace Reference Diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/ewd998-trace-reference.yml
      - Sources/UpstreamParity/Conformance/EWD998ChanTraceReference.swift
      - Sources/TLCValidate/UpstreamCommand.swift
      - Verification/FiniteGraph/community-modules.json
      - Verification/FiniteGraph/fixtures/ewd998/EWD998ChanTrace.*
      - scripts/setup-finite-graph-tools.sh

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SWIFT_TLA_SHA: ${{ github.event.pull_request.head.sha }}
  FINITE_GRAPH_TOOL_ROOT: ${{ github.workspace }}/.build/finite-graph-tools

jobs:
  reference:
    name: Pinned upstream trace only (diagnostic)
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - name: Validate immutable source revision
        run: '[[ "$SWIFT_TLA_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          submodules: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
      - name: Retain source revision even if checking fails
        run: |
          mkdir -p .build/validation-evidence
          git rev-parse HEAD > .build/validation-evidence/trace-source-sha.txt
      - name: Build trace reference diagnostic
        run: swift build --configuration release --product tlc-validate -Xswiftc -warnings-as-errors -j 1
      - uses: actions/cache@v4
        with:
          path: |
            .build/finite-graph-tools/downloads
            .build/finite-graph-tools/java-arm64
            .build/finite-graph-tools/java-x86_64
          key: tlc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Verification/FiniteGraph/toolchain.json') }}
      - name: Prepare pinned TLC and trace-only CommunityModules
        env:
          FINITE_GRAPH_GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/setup-finite-graph-tools.sh --tool-root "$FINITE_GRAPH_TOOL_ROOT" --skip-inputs --with-community-modules
      - name: Check pinned upstream trace and retain selected causal order
        env:
          SWIFTTLA_TRACE_TIMEOUT_SECONDS: '1800'
        run: |
          .build/release/tlc-validate upstream trace-reference \
            --output .build/validation-evidence/ewd998-trace-reference
          jq -e '.schema == "swifttla.ewd998-trace-reference" and .result == "completed" and .nodeCount == 5 and .eventCount == 654 and .causalOrderCaptured == true' \
            .build/validation-evidence/ewd998-trace-reference/report.json
          test -s .build/validation-evidence/ewd998-trace-reference/tlc/tlc-process.json
          test -s .build/validation-evidence/ewd998-trace-reference/tlc-order/tlc-process.json
          test -s .build/validation-evidence/ewd998-trace-reference/selected-order.json
          test "$(jq length .build/validation-evidence/ewd998-trace-reference/selected-order.json)" -eq 654
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: ewd998-trace-reference-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}
          path: |
            .build/validation-evidence/trace-source-sha.txt
            .build/validation-evidence/ewd998-trace-reference
          compression-level: 0
          include-hidden-files: true
          if-no-files-found: warn
