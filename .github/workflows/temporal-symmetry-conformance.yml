name: Temporal and Symmetry Conformance

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-head:
    runs-on: ubuntu-latest
    outputs:
      run_expensive: ${{ steps.head.outputs.run_expensive }}
    steps:
      - id: head
        uses: actions/github-script@v8
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run_expensive', 'true')
              return
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'temporal-symmetry-conformance.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            })
            const previous = data.workflow_runs[0]
            core.setOutput('run_expensive', String(!previous || previous.head_sha !== context.sha))

  temporal-symmetry-conformance:
    needs: check-head
    if: needs.check-head.outputs.run_expensive == 'true'
    runs-on: macos-15
    env:
      FINITE_GRAPH_TOOL_ROOT: ${{ github.workspace }}/.build/finite-graph-tools
    steps:
      - uses: actions/checkout@v5

      - name: Run temporal-symmetry conformance
        run: ./scripts/run_temporal_symmetry_conformance.sh --output .build/temporal-symmetry-conformance

      - name: Upload temporal-symmetry evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: temporal-symmetry-conformance-${{ github.run_id }}
          path: |
            .build/temporal-symmetry-conformance
          if-no-files-found: warn
