name: Temporal and Symmetry Conformance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporal-symmetry-conformance.yml'
      - 'Makefile'
      - 'Package.swift'
      - 'Sources/TLCValidate/**'
      - 'Sources/UpstreamParity/Conformance/**'
      - 'Tests/Fixtures/TemporalSymmetryConformance/CI/**'
      - 'Tests/Fixtures/TemporalSymmetryConformance/Release/**'
      - 'Tools/TLCGraphBridge/**'
      - 'Verification/CoreConformance/**'
      - 'Verification/TemporalSymmetryConformance/**'
      - 'scripts/run_core_support_gate.sh'
      - 'scripts/run_temporal_symmetry_support_gate.sh'
      - 'scripts/check_temporal_symmetry_release.sh'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporal-symmetry-conformance.yml'
      - 'Makefile'
      - 'Package.swift'
      - 'Sources/TLCValidate/**'
      - 'Sources/UpstreamParity/Conformance/**'
      - 'Tests/Fixtures/TemporalSymmetryConformance/CI/**'
      - 'Tests/Fixtures/TemporalSymmetryConformance/Release/**'
      - 'Tools/TLCGraphBridge/**'
      - 'Verification/CoreConformance/**'
      - 'Verification/TemporalSymmetryConformance/**'
      - 'scripts/run_core_support_gate.sh'
      - 'scripts/run_temporal_symmetry_support_gate.sh'
      - 'scripts/check_temporal_symmetry_release.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporal-symmetry-conformance:
    runs-on: macos-15
    env:
      CORE_CONFORMANCE_TOOL_ROOT: ${{ github.workspace }}/.build/core-conformance-tools
    steps:
      - uses: actions/checkout@v4

      - name: Validate focused workflow contract
        run: Tests/Fixtures/TemporalSymmetryConformance/CI/assert_workflow.sh

      - name: Run mandatory temporal-symmetry gate
        id: conformance
        continue-on-error: true
        run: |
          set +e
          make temporal-symmetry-release-check
          status=$?
          set -e

          mkdir -p .build/temporal-symmetry-ci
          printf '%s\n' "$status" > .build/temporal-symmetry-ci/exit-code
          case "$status" in
            0)
              echo "Temporal and symmetry support gate passed (exit 0)."
              ;;
            1)
              echo "::error::Temporal or symmetry evidence blocks admission (exit 1)."
              ;;
            2)
              echo "::warning::Temporal or symmetry evidence is unavailable or unsafe to evaluate (exit 2)."
              ;;
            *)
              echo "::error::Temporal and symmetry conformance returned an unexpected exit $status."
              status=2
              ;;
          esac
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Upload temporal-symmetry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: temporal-symmetry-conformance-${{ github.run_id }}
          path: |
            .build/temporal-symmetry-support-gate
            .build/temporal-symmetry-ci
          if-no-files-found: warn

      - name: Enforce temporal-symmetry result
        if: always()
        env:
          TEMPORAL_SYMMETRY_EXIT: ${{ steps.conformance.outputs.exit_code }}
        run: |
          case "$TEMPORAL_SYMMETRY_EXIT" in
            0)
              exit 0
              ;;
            1)
              exit 1
              ;;
            2)
              exit 2
              ;;
            *)
              echo "temporal-symmetry did not report a recognized result" >&2
              exit 2
              ;;
          esac
