name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hosted_diagnostics:
        description: Run unstable hosted macOS test and coverage diagnostics.
        required: false
        default: false
        type: boolean

jobs:
  release-code-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Validate local validation lock contract
        run: bash Tests/Fixtures/LocalValidation/assert_lock.sh

      - name: Validate release code-check contract
        run: bash Tests/Fixtures/ReleaseCodeCheck/assert_workflow.sh

      - name: Run SwiftLint (advisory)
        run: |
          set +e
          ./scripts/lint-zero-new.sh
          lint_status=$?
          set -e
          if [ "$lint_status" -ne 0 ]; then
            echo "::warning::SwiftLint violations found; see this step's diagnostics."
          fi

      - name: Run tests (hosted diagnostic)
        if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_diagnostics
        run: |
          set +e
          xcodebuild test -scheme SwiftTLA-Package -destination 'platform=macOS'
          test_status=$?
          set -e
          if [ "$test_status" -ne 0 ]; then
            echo "::warning::Hosted macOS test runner failed (exit $test_status). Run make ci-local before making a release claim."
          fi

      - name: Run coverage (hosted diagnostic)
        if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_diagnostics
        run: |
          set +e
          xcodebuild test -scheme SwiftTLA-Package -destination 'platform=macOS' -enableCodeCoverage YES
          coverage_status=$?
          set -e
          if [ "$coverage_status" -ne 0 ]; then
            echo "::warning::Hosted macOS coverage runner failed (exit $coverage_status). Run make ci-local before making a release claim."
          fi

  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - run: swift build --target SwiftTLA -j 1

  apple-platform-examples:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build and test Apple platform examples
        working-directory: Examples/ApplePlatformExamples
        run: xcodebuild test -scheme ApplePlatformExamples-Package -destination 'platform=macOS' -parallel-testing-enabled NO -parallel-testing-worker-count 1 -jobs 1

      - name: Build SwiftUI demo app
        working-directory: Examples/SwiftTLADemoApp
        run: xcodebuild build -scheme SwiftTLADemoApp-Package -destination 'platform=macOS' -jobs 1

  canonical-corpus-export:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build canonical corpus exporter
        run: swift build --product canonical-corpus-export -j 1

      - name: Export canonical upstream corpus
        run: |
          swift run --skip-build canonical-corpus-export \
            --output .build/canonical-corpus-export \
            --swift-tla-sha "$GITHUB_SHA"

      - name: Upload canonical corpus input
        uses: actions/upload-artifact@v6
        with:
          name: canonical-corpus-${{ github.sha }}
          path: .build/canonical-corpus-export
          if-no-files-found: error
          retention-days: 14
