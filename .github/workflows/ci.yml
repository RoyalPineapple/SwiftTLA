name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Activate macro target
        run: |
          sed -i '' 's/executableTarget(name: "SwiftTLAMacros"/macro(name: "SwiftTLAMacros"/' Package.swift
      - name: Build macro
        run: swift build --target SwiftTLAMacros
