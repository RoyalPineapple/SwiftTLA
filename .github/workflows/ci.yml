name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --filter SwiftTLATests

  demo:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift run demo

  macro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target SwiftTLAPlugin
