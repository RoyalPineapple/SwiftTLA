name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      contracts_only:
        description: Run ordinary, upstream, consumer, and export diagnostics only (not admission)
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SWIFT_TLA_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

jobs:
  swift-test-suites:
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.contracts_only && '["ordinary","upstream"]' || '["ordinary","finite-graphs","scenarios","upstream"]') }}
    runs-on: macos-15
    timeout-minutes: ${{ (matrix.suite == 'scenarios' || matrix.suite == 'finite-graphs') && 125 || 60 }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}

      - name: Validate local validation lock contract
        run: bash Tests/Fixtures/LocalValidation/assert_lock.sh

      - name: Run complete Swift test suite
        timeout-minutes: ${{ (matrix.suite == 'scenarios' || matrix.suite == 'finite-graphs') && 120 || 60 }}
        run: |
          configuration=release
          case '${{ matrix.suite }}' in
            ordinary) configuration=debug; selection=(--skip 'FiniteGraphCheckTests|UpstreamParityTests|ScenarioValidationTests') ;;
            finite-graphs) selection=(--filter FiniteGraphCheckTests) ;;
            scenarios) selection=(--filter ScenarioValidationTests) ;;
            upstream) selection=(--filter UpstreamParityTests) ;;
            *) exit 64 ;;
          esac
          mkdir -p .build/test-diagnostics
          git rev-parse HEAD > .build/test-diagnostics/source-sha.txt
          test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
          swift --version | tee .build/test-diagnostics/swift-version.txt
          xcodebuild -version | tee .build/test-diagnostics/xcode-version.txt
          xcrun --sdk macosx --show-sdk-build-version | tee .build/test-diagnostics/sdk-build-version.txt
          echo "$configuration" > .build/test-diagnostics/build-configuration.txt
          echo Debug > .build/test-diagnostics/assertion-configuration.txt
          (
            while sleep 300; do
              ps -axo pid,ppid,etime,%cpu,rss,command > ".build/test-diagnostics/$(date +%s)-processes.txt"
              for pid in $(pgrep -f '[/]swiftpm-testing-helper([[:space:]]|$)' || true); do
                sample "$pid" 1 -file ".build/test-diagnostics/$(date +%s)-$pid.txt" || true
              done
            done
          ) &
          sampler=$!
          trap 'kill "$sampler" 2>/dev/null || true' EXIT
          swift test --configuration "$configuration" -Xswiftc -assert-config -Xswiftc Debug -Xswiftc -warnings-as-errors -j 1 --no-parallel "${selection[@]}"

      - name: Retain Swift test stack samples
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: swift-test-diagnostics-${{ matrix.suite }}-${{ env.SWIFT_TLA_SHA }}
          path: .build/test-diagnostics
          if-no-files-found: error
          retention-days: 14

  swift-tests:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.contracts_only && 'Selected Swift contracts (diagnostic)' || 'swift-tests' }}
    needs: swift-test-suites
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SWIFT_TEST_RESULT: ${{ needs.swift-test-suites.result }}
    steps:
      - name: Require every Swift test suite to pass
        run: test "$SWIFT_TEST_RESULT" = success

  apple-platform-examples:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}

      - id: adoption-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Prepare Apple-platform adoption evidence
        working-directory: Examples/ApplePlatformExamples
        run: |
          mkdir -p .build/adoption-evidence
          git rev-parse HEAD > .build/adoption-evidence/source-sha.txt

      - name: Build camera adoption executable
        working-directory: Examples/ApplePlatformExamples
        run: |
          set -o pipefail
          xcodebuild SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO -scheme av-pipeline-example -destination 'platform=macOS' -jobs 1 build | tee .build/adoption-evidence/camera-executable-build.log

      - name: Run camera adoption contracts
        working-directory: Examples/ApplePlatformExamples
        run: |
          set -o pipefail
          xcodebuild test SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO -scheme ApplePlatformExamples-Package -destination 'platform=macOS,arch=arm64' -only-testing:ApplePlatformExamplesTests/GeneratedAppleModelTests -only-testing:ApplePlatformExamplesTests/CameraAdoptionProofTests -parallel-testing-enabled NO -parallel-testing-worker-count 1 -jobs 1 -resultBundlePath .build/adoption-evidence/camera-adoption-contracts.xcresult | tee .build/adoption-evidence/camera-adoption-contracts.log

      - name: Verify complete Apple-platform adoption evidence
        working-directory: Examples/ApplePlatformExamples
        run: |
          set -euo pipefail
          for record in \
            .build/adoption-evidence/source-sha.txt \
            .build/adoption-evidence/camera-executable-build.log \
            .build/adoption-evidence/camera-adoption-contracts.log; do
            test -f "$record" || { echo "Missing adoption evidence file: $record"; exit 1; }
          done
          test -d .build/adoption-evidence/camera-adoption-contracts.xcresult || {
            echo "Missing adoption evidence result bundle: .build/adoption-evidence/camera-adoption-contracts.xcresult"
            exit 1
          }
          for suite in GeneratedAppleModelTests CameraAdoptionProofTests; do
            grep -A1 "Test Suite '$suite' passed at" .build/adoption-evidence/camera-adoption-contracts.log \
              | grep -q 'Executed 6 tests, with 0 failures (0 unexpected)' \
              || { echo "$suite did not pass exactly six tests"; exit 1; }
          done

      - name: Upload Apple-platform adoption evidence
        uses: actions/upload-artifact@v6
        with:
          name: apple-platform-adoption-${{ steps.adoption-source.outputs.sha }}
          path: Examples/ApplePlatformExamples/.build/adoption-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

      - name: Build SwiftUI demo app
        working-directory: Examples/SwiftTLADemoApp
        run: xcodebuild build SWIFT_TREAT_WARNINGS_AS_ERRORS=YES SWIFT_SUPPRESS_WARNINGS=NO -scheme SwiftTLADemoApp -destination 'platform=macOS,arch=arm64' -jobs 1

      - name: Run generated demo-model contracts
        working-directory: Examples/SwiftTLADemos
        run: |
          set -euo pipefail
          mkdir -p .build/demo-evidence
          git rev-parse HEAD > .build/demo-evidence/source-sha.txt
          test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
          swift --version > .build/demo-evidence/swift-version.txt
          xcodebuild -version > .build/demo-evidence/xcode-version.txt
          xcrun --sdk macosx --show-sdk-build-version > .build/demo-evidence/sdk-build-version.txt
          swift test -Xswiftc -warnings-as-errors -j 1 --no-parallel 2>&1 | tee .build/demo-evidence/demo-contracts.log

      - name: Retain generated demo-model evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: generated-demo-models-${{ env.SWIFT_TLA_SHA }}
          path: Examples/SwiftTLADemos/.build/demo-evidence
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  canonical-corpus-export:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}

      - id: corpus-source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build canonical corpus exporter
        run: swift build -Xswiftc -warnings-as-errors --product canonical-corpus-export -j 1

      - name: Export canonical upstream corpus
        run: |
          swift run --skip-build canonical-corpus-export \
            --output .build/canonical-corpus-export \
            --swift-tla-sha "${{ steps.corpus-source.outputs.sha }}"

      - name: Upload canonical corpus input
        uses: actions/upload-artifact@v6
        with:
          name: canonical-corpus-${{ steps.corpus-source.outputs.sha }}
          path: .build/canonical-corpus-export
          if-no-files-found: error
          retention-days: 14
