name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_hosted_diagnostics:
        description: Run hosted macOS coverage diagnostics.
        required: false
        default: false
        type: boolean

jobs:
  release-code-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Validate pinned core-conformance baseline
        run: |
          baseline_path="Verification/CoreConformance/baselines"
          if ! git -C "$baseline_path" rev-parse --verify HEAD >/dev/null 2>&1; then
            echo "::error::Pinned core-conformance baseline is unavailable."
            exit 1
          fi
          expected_baseline="$(git ls-tree HEAD "$baseline_path" | awk '{print $3}')"
          actual_baseline="$(git -C "$baseline_path" rev-parse HEAD)"
          if [ -z "$expected_baseline" ] || [ "$actual_baseline" != "$expected_baseline" ]; then
            echo "::error::Pinned core-conformance baseline does not match the repository checkout."
            exit 1
          fi

      - name: Validate release code-check contract
        run: bash Tests/Fixtures/ReleaseCodeCheck/assert_workflow.sh

      - name: Run SwiftLint (advisory)
        run: |
          set +e
          ./scripts/lint-zero-new.sh
          lint_status=$?
          set -e
          if [ "$lint_status" -ne 0 ]; then
            echo "::warning::SwiftLint violations found; see this step's diagnostics."
          fi

      - name: Run full macOS test suite
        run: xcodebuild test -scheme SwiftTLA-Package -destination 'platform=macOS'

      - name: Run coverage (hosted diagnostic)
        if: github.event_name == 'workflow_dispatch' && inputs.run_hosted_diagnostics
        run: |
          set +e
          xcodebuild test -scheme SwiftTLA-Package -destination 'platform=macOS' -enableCodeCoverage YES
          coverage_status=$?
          set -e
          if [ "$coverage_status" -ne 0 ]; then
            echo "::warning::Hosted macOS coverage runner failed (exit $coverage_status). Run make ci-local before making a release claim."
          fi

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  macro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target SwiftTLAMacros
