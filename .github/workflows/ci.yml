name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  release-code-check:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Validate release code-check contract
        run: bash Tests/Fixtures/ReleaseCodeCheck/assert_workflow.sh

      - name: Run SwiftLint (advisory)
        run: |
          set +e
          ./scripts/lint-zero-new.sh
          lint_status=$?
          set -e
          if [ "$lint_status" -ne 0 ]; then
            echo "::warning::SwiftLint violations found; see this step's diagnostics."
          fi

      - name: Run tests
        run: swift test

      - name: Run coverage
        run: swift test --enable-code-coverage

  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build

  macro:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --target SwiftTLAMacros
