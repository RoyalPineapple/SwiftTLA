name: Core Conformance

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  check-head:
    runs-on: ubuntu-latest
    outputs:
      run_expensive: ${{ steps.head.outputs.run_expensive }}
    steps:
      - id: head
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('run_expensive', 'true')
              return
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'core-conformance.yml',
              branch: 'main',
              status: 'completed',
              per_page: 1
            })
            const previous = data.workflow_runs[0]
            core.setOutput('run_expensive', String(!previous || previous.head_sha !== context.sha))

  core-conformance:
    needs: check-head
    if: needs.check-head.outputs.run_expensive == 'true'
    runs-on: macos-15
    env:
      CORE_CONFORMANCE_TOOL_ROOT: ${{ github.workspace }}/.build/core-conformance-tools
    steps:
      - uses: actions/checkout@v4

      - name: Validate focused workflow contract
        run: Tests/Fixtures/CoreConformance/CI/assert_workflow.sh

      - name: Run mandatory core-support gate
        id: conformance
        run: |
          set +e
          make core-support-gate
          status=$?

          mkdir -p .build/core-conformance-ci
          printf '%s\n' "$status" > .build/core-conformance-ci/exit-code
          case "$status" in
            0)
              echo "Core support gate passed (exit 0)."
              echo "enforcement_exit=0" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "::error::Core support gate blocked admission (exit 1)."
              echo "enforcement_exit=1" >> "$GITHUB_OUTPUT"
              ;;
            2)
              echo "::warning::Core support gate could not evaluate because its exact external verifier or evidence was unavailable (exit 2). Run make ci-local on a provisioned machine before making a support claim."
              echo "enforcement_exit=0" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Core conformance returned an unexpected exit $status."
              echo "enforcement_exit=2" >> "$GITHUB_OUTPUT"
              ;;
          esac
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"

      - name: Upload core-conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-conformance-${{ github.run_id }}
          path: |
            .build/core-support-gate
            .build/core-conformance-ci
          if-no-files-found: warn

      - name: Enforce core-conformance result
        if: always()
        env:
          CORE_CONFORMANCE_EXIT: ${{ steps.conformance.outputs.enforcement_exit }}
        run: |
          case "$CORE_CONFORMANCE_EXIT" in
            0)
              exit 0
              ;;
            1)
              exit 1
              ;;
            2)
              exit 2
              ;;
            *)
              echo "core-conformance did not report a recognized result" >&2
              exit 2
              ;;
          esac
