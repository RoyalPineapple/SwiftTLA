name: Finite Graph Comparison

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      swift_tla_sha:
        description: Immutable SwiftTLA SHA
        required: true
        type: string
      admission_mode:
        description: Candidate is pre-merge validation; admission requires a merged revision
        required: true
        default: admission
        type: choice
        options: [candidate, admission]

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer

jobs:
  finite-graph:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      ADMISSION_MODE: ${{ inputs.admission_mode || 'admission' }}
      SWIFT_TLA_SHA: ${{ inputs.swift_tla_sha || github.sha }}
      FINITE_GRAPH_TOOL_ROOT: ${{ github.workspace }}/.build/finite-graph-tools
    steps:
      - name: Validate SwiftTLA SHA
        run: |
          [[ "$SWIFT_TLA_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$ADMISSION_MODE" = candidate || "$ADMISSION_MODE" = admission ]]

      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          fetch-depth: 0
          submodules: false

      - id: revision
        name: Verify SwiftTLA revision
        run: |
          resolved_sha="$(git rev-parse HEAD)"
          [ "$resolved_sha" = "$SWIFT_TLA_SHA" ]
          if [ "$ADMISSION_MODE" = admission ]; then
            git merge-base --is-ancestor "$resolved_sha" refs/remotes/origin/main
          fi
          echo "sha=$resolved_sha" >> "$GITHUB_OUTPUT"

      - name: Validate all model-owned corpus scenarios
        env:
          FINITE_GRAPH_GITHUB_TOKEN: ${{ github.token }}
          SWIFTTLA_SCENARIO_MAXIMUM_STATES: "2000000"
          SWIFTTLA_SCENARIO_TIMEOUT_SECONDS: "600"
        run: |
          ./scripts/setup-finite-graph-tools.sh --tool-root "$FINITE_GRAPH_TOOL_ROOT"
          unset FINITE_GRAPH_GITHUB_TOKEN
          swift run --configuration release -Xswiftc -warnings-as-errors -j 1 tlc-validate scenarios run --output .build/scenario-evidence

      - name: Run exact finite graph comparison
        env:
          FINITE_GRAPH_GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/run_finite_graph_check.sh --case all --output .build/finite-graph-evidence

      - name: Upload finite-graph evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: finite-graph-${{ env.ADMISSION_MODE }}-${{ steps.revision.outputs.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .build/finite-graph-evidence
            .build/scenario-evidence
          include-hidden-files: true
          if-no-files-found: error
