name: Independent Validation Pipeline

on:
  pull_request:
  workflow_dispatch:
    inputs:
      swift_tla_sha:
        description: Immutable SwiftTLA SHA to validate
        required: true
        type: string
      admission_mode:
        description: Candidate or merged-revision admission
        required: true
        default: candidate
        type: choice
        options: [candidate, admission]
      case_id:
        description: One case or scenario ID for a focused candidate diagnostic (empty runs all)
        type: string
        default: ''
      profile_native:
        description: Sample the native checker during one focused candidate diagnostic
        type: boolean
        default: false
      replay_run_id:
        description: Prior hosted run ID whose retained evidence is replayed without either checker
        type: string
        default: ''
      replay_artifact_name:
        description: Exact dsl-native artifact name from the prior run
        type: string
        default: ''
      replay_sha:
        description: Source SHA that produced the retained evidence
        type: string
        default: ''

permissions:
  contents: read
  actions: read

env:
  DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
  SWIFT_TLA_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.swift_tla_sha || github.sha }}
  ADMISSION_MODE: ${{ inputs.admission_mode || 'candidate' }}

jobs:
  prepare:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.replay_run_id == '' }}
    runs-on: macos-15
    timeout-minutes: 45
    outputs:
      native: ${{ steps.cases.outputs.native }}
      upstream: ${{ steps.cases.outputs.upstream }}
    steps:
      - name: Validate immutable candidate
        run: '[[ "$SWIFT_TLA_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          fetch-depth: 0
          submodules: false
      - name: Verify revision and admission mode
        run: |
          test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
          if [ "$ADMISSION_MODE" = admission ]; then
            git merge-base --is-ancestor "$SWIFT_TLA_SHA" refs/remotes/origin/main
          fi
      - uses: actions/cache@v4
        id: binary-cache
        with:
          path: .build/release/tlc-validate
          key: validation-binary-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
      - name: Build validator for this revision
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: swift build --configuration release --product tlc-validate -Xswiftc -warnings-as-errors -j 1
      - name: Verify cached or built executable
        run: test -x .build/release/tlc-validate
      - name: Enumerate complete case coverage
        id: cases
        env:
          FOCUSED_CASE: ${{ inputs.case_id }}
        run: |
          native=$(.build/release/tlc-validate native list)
          upstream=$(.build/release/tlc-validate upstream list)
          if [ -n "$FOCUSED_CASE" ]; then
            test "$ADMISSION_MODE" = candidate
            native=$(jq -ce --arg id "$FOCUSED_CASE" '[.[] | select(. == $id)]' <<< "$native")
            upstream=$(jq -ce --arg id "$FOCUSED_CASE" '[.[] | select(. == $id)]' <<< "$upstream")
            test "$(jq 'length' <<< "$native")" -gt 0 || test "$(jq 'length' <<< "$upstream")" -gt 0
            if [ "$(jq 'length' <<< "$native")" -eq 0 ]; then native='["__skip__"]'; fi
            if [ "$(jq 'length' <<< "$upstream")" -eq 0 ]; then upstream='["__skip__"]'; fi
          else
            test "$(jq 'length' <<< "$native")" -gt 0
            test "$(jq 'length' <<< "$upstream")" -gt 0
          fi
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        with:
          name: validation-binary-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/release/tlc-validate
          if-no-files-found: error

  dsl-native-parity:
    name: DSL/native parity ${{ matrix.case }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.native)[0] != '__skip__' }}
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.native) }}
    env:
      CASE_ID: ${{ matrix.case }}
      FINITE_GRAPH_TOOL_ROOT: ${{ github.workspace }}/.build/finite-graph-tools
      SWIFTTLA_ORACLE_TIMEOUT_SECONDS: '1800'
      PROFILE_NATIVE: ${{ inputs.profile_native && 'true' || 'false' }}
      FOCUSED_CASE: ${{ inputs.case_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          submodules: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
      - uses: actions/download-artifact@v5
        with:
          name: validation-binary-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/validation-bin
      - uses: actions/cache@v4
        with:
          path: |
            .build/finite-graph-tools/downloads
            .build/finite-graph-tools/java-arm64
            .build/finite-graph-tools/java-x86_64
          key: tlc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Verification/FiniteGraph/toolchain.json') }}
      - name: Prepare pinned TLC without upstream examples
        env:
          FINITE_GRAPH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x .build/validation-bin/tlc-validate
          ./scripts/setup-finite-graph-tools.sh --tool-root "$FINITE_GRAPH_TOOL_ROOT" --skip-inputs
      - name: Identify generated TLC inputs
        id: oracle-key
        run: |
          key=$(.build/validation-bin/tlc-validate oracle cache-key --case "$CASE_ID" --maximum-states 10000000)
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        id: oracle-cache
        with:
          path: .build/validation-evidence/oracle/${{ matrix.case }}
          key: generated-tlc-${{ runner.os }}-${{ runner.arch }}-${{ steps.oracle-key.outputs.key }}-${{ hashFiles('Sources/UpstreamParity/Conformance/GeneratedTLCOracle.swift', 'Sources/UpstreamParity/Conformance/TLCProcess.swift') }}
      - name: Validate generated Swift machine
        timeout-minutes: 30
        run: |
          set -o pipefail
          mkdir -p .build/validation-evidence
          git rev-parse HEAD > .build/validation-evidence/source-sha.txt
          if [ "$PROFILE_NATIVE" = true ]; then
            test "$ADMISSION_MODE" = candidate
            test "$FOCUSED_CASE" = "$CASE_ID"
            /usr/bin/time -l .build/validation-bin/tlc-validate native run --case "$CASE_ID" \
              --output .build/validation-evidence/native --maximum-states 10000000 &
            timed_pid=$!
            sleep 90
            native_pid=$(pgrep -P "$timed_pid" -f 'tlc-validate native run' | head -n 1 || true)
            if [ -z "$native_pid" ]; then
              wait "$timed_pid" || true
              echo 'Native checker process was unavailable for sampling' >&2
              exit 1
            fi
            mkdir -p .build/validation-evidence/native-profiles
            sample_status=0
            sample "$native_pid" 20 5 \
              -file ".build/validation-evidence/native-profiles/$CASE_ID.sample.txt" || sample_status=$?
            native_status=0
            wait "$timed_pid" || native_status=$?
            test "$sample_status" -eq 0
            test "$native_status" -eq 0
          else
            /usr/bin/time -l .build/validation-bin/tlc-validate native run --case "$CASE_ID" \
              --output .build/validation-evidence/native --maximum-states 10000000
          fi
          jq -c . ".build/validation-evidence/native/$CASE_ID/machine.profile.json"
      - name: Validate generated TLA with TLC
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        timeout-minutes: 35
        run: |
          set -o pipefail
          .build/validation-bin/tlc-validate oracle run --case "$CASE_ID" \
            --output .build/validation-evidence/oracle --maximum-states 10000000
          jq -n --arg key '${{ steps.oracle-key.outputs.key }}' --arg sha "$SWIFT_TLA_SHA" \
            --arg run "$GITHUB_RUN_ID" '{cacheKey:$key,sourceSHA:$sha,originRunID:$run}' \
            > ".build/validation-evidence/oracle/$CASE_ID/evidence-origin.json"
      - name: Require complete generated TLC evidence
        env:
          ORACLE_INPUT_KEY: ${{ steps.oracle-key.outputs.key }}
        run: |
          jq -e '.schema == "swifttla.generated-tlc-oracle" and .caseID == env.CASE_ID' ".build/validation-evidence/oracle/$CASE_ID/oracle.json"
          jq -e --arg key "$ORACLE_INPUT_KEY" '.cacheKey == $key and .sourceSHA != "" and .originRunID != ""' ".build/validation-evidence/oracle/$CASE_ID/evidence-origin.json"
      - uses: actions/cache/save@v4
        if: steps.oracle-cache.outputs.cache-hit != 'true'
        with:
          path: .build/validation-evidence/oracle/${{ matrix.case }}
          key: generated-tlc-${{ runner.os }}-${{ runner.arch }}-${{ steps.oracle-key.outputs.key }}-${{ hashFiles('Sources/UpstreamParity/Conformance/GeneratedTLCOracle.swift', 'Sources/UpstreamParity/Conformance/TLCProcess.swift') }}
      - name: Require exact native and TLC evidence
        timeout-minutes: 60
        run: |
          set -o pipefail
          /usr/bin/time -l .build/validation-bin/tlc-validate compare run --case "$CASE_ID" \
            --native .build/validation-evidence/native \
            --oracle .build/validation-evidence/oracle \
            --output .build/validation-evidence/comparison
          jq -e '.result == "exact"' ".build/validation-evidence/comparison/$CASE_ID/comparison.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dsl-native-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
          path: |
            .build/validation-evidence
            !.build/validation-evidence/**/work/**
          include-hidden-files: true
          if-no-files-found: error

  upstream-parity:
    name: Upstream TLC parity ${{ matrix.case }}
    needs: prepare
    if: ${{ fromJSON(needs.prepare.outputs.upstream)[0] != '__skip__' }}
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        case: ${{ fromJSON(needs.prepare.outputs.upstream) }}
    env:
      CASE_ID: ${{ matrix.case }}
      FINITE_GRAPH_TOOL_ROOT: ${{ github.workspace }}/.build/finite-graph-tools
      FINITE_GRAPH_INPUT_ROOT: ${{ github.workspace }}/.build/finite-graph-tools/inputs
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          submodules: false
      - name: Verify exact source revision
        run: test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
      - uses: actions/download-artifact@v5
        with:
          name: validation-binary-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .build/validation-bin
      - uses: actions/cache@v4
        with:
          path: |
            .build/finite-graph-tools/downloads
            .build/finite-graph-tools/java-arm64
            .build/finite-graph-tools/java-x86_64
          key: tlc-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Verification/FiniteGraph/toolchain.json') }}
      - name: Prepare pinned TLC and reference inputs
        env:
          FINITE_GRAPH_GITHUB_TOKEN: ${{ github.token }}
        run: |
          chmod +x .build/validation-bin/tlc-validate
          ./scripts/setup-finite-graph-tools.sh --tool-root "$FINITE_GRAPH_TOOL_ROOT"
      - name: Record exact source revision
        run: |
          mkdir -p .build/validation-evidence
          git rev-parse HEAD > .build/validation-evidence/source-sha.txt
      - name: Identify upstream comparison inputs
        id: upstream-key
        run: |
          key=$(.build/validation-bin/tlc-validate upstream cache-key --case "$CASE_ID")
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: upstream-cache
        with:
          path: .build/validation-evidence/upstream/${{ matrix.case }}
          key: upstream-tlc-${{ runner.os }}-${{ runner.arch }}-${{ steps.upstream-key.outputs.key }}-${{ hashFiles('Sources/UpstreamParity/Conformance/UpstreamTLCParity.swift', 'Sources/UpstreamParity/Conformance/ValidationEvidenceComparison.swift', 'Sources/UpstreamParity/Conformance/CompactTLCGraphEvent.swift', 'Sources/UpstreamParity/Conformance/TLCProcess.swift', 'Sources/SwiftTLA/SpecCompilation.swift') }}
      - name: Compare generated and upstream TLA through TLC
        if: steps.upstream-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: |
          set -o pipefail
          .build/validation-bin/tlc-validate upstream run --case "$CASE_ID" \
            --output .build/validation-evidence/upstream
          jq -n --arg key '${{ steps.upstream-key.outputs.key }}' --arg sha "$SWIFT_TLA_SHA" \
            --arg run "$GITHUB_RUN_ID" '{cacheKey:$key,sourceSHA:$sha,originRunID:$run}' \
            > ".build/validation-evidence/upstream/$CASE_ID/evidence-origin.json"
      - name: Require exact upstream evidence
        env:
          UPSTREAM_INPUT_KEY: ${{ steps.upstream-key.outputs.key }}
        run: |
          jq -e '.schema == "swifttla.upstream-tlc-parity" and .caseID == env.CASE_ID and .result == "exact"' ".build/validation-evidence/upstream/$CASE_ID/comparison.json"
          jq -e --arg key "$UPSTREAM_INPUT_KEY" '.cacheKey == $key and .sourceSHA != "" and .originRunID != ""' ".build/validation-evidence/upstream/$CASE_ID/evidence-origin.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: upstream-parity-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.case }}
          path: |
            .build/validation-evidence
            !.build/validation-evidence/**/work/**
          include-hidden-files: true
          if-no-files-found: error

  validation-pipeline:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.case_id != '' && 'Independent validation diagnostic' || 'Independent validation admission' }}
    needs: [prepare, dsl-native-parity, upstream-parity]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.replay_run_id == '') }}
    runs-on: ubuntu-latest
    steps:
      - name: Require both independent parity jobs
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          NATIVE_RESULT: ${{ needs.dsl-native-parity.result }}
          UPSTREAM_RESULT: ${{ needs.upstream-parity.result }}
          FOCUSED_CASE: ${{ inputs.case_id }}
        run: |
          test "$PREPARE_RESULT" = success
          if [ -n "$FOCUSED_CASE" ]; then
            { test "$NATIVE_RESULT" = success || test "$NATIVE_RESULT" = skipped; }
            { test "$UPSTREAM_RESULT" = success || test "$UPSTREAM_RESULT" = skipped; }
            { test "$NATIVE_RESULT" = success || test "$UPSTREAM_RESULT" = success; }
          else
            test "$NATIVE_RESULT" = success
            test "$UPSTREAM_RESULT" = success
          fi

  comparison-replay:
    name: Comparison replay diagnostic
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.replay_run_id != '' }}
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CASE_ID: ${{ inputs.case_id }}
      REPLAY_RUN_ID: ${{ inputs.replay_run_id }}
      REPLAY_SHA: ${{ inputs.replay_sha }}
      REPLAY_ARTIFACT_NAME: ${{ inputs.replay_artifact_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.SWIFT_TLA_SHA }}
          fetch-depth: 0
          submodules: false
      - name: Require immutable diagnostic and evidence revisions
        run: |
          test "$(git rev-parse HEAD)" = "$SWIFT_TLA_SHA"
          [[ "$REPLAY_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$REPLAY_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          test -n "$CASE_ID"
          test -n "$REPLAY_ARTIFACT_NAME"
          git cat-file -e "$REPLAY_SHA^{commit}"
          case "$REPLAY_ARTIFACT_NAME" in
            "dsl-native-$REPLAY_SHA-$REPLAY_RUN_ID-"*"-$CASE_ID") ;;
            *) echo "Replay artifact does not match evidence revision and case" >&2; exit 1 ;;
          esac
      - uses: actions/download-artifact@v5
        with:
          run-id: ${{ inputs.replay_run_id }}
          name: ${{ inputs.replay_artifact_name }}
          github-token: ${{ github.token }}
          path: .build/replay-evidence
      - name: Require exact retained evidence origin
        run: |
          test "$(cat .build/replay-evidence/source-sha.txt)" = "$REPLAY_SHA"
          test -f ".build/replay-evidence/native/$CASE_ID/machine.bin"
          test -f ".build/replay-evidence/oracle/$CASE_ID/tlc-graph/graph-events.bin"
      - uses: actions/cache@v4
        id: binary-cache
        with:
          path: .build/release/tlc-validate
          key: validation-binary-${{ runner.os }}-${{ runner.arch }}-xcode-16.4-${{ hashFiles('Package.swift', 'Package.resolved', 'Sources/**/*.swift') }}
      - name: Build comparator for this revision
        if: steps.binary-cache.outputs.cache-hit != 'true'
        run: swift build --configuration release --product tlc-validate -Xswiftc -warnings-as-errors -j 1
      - name: Compare retained complete evidence
        run: |
          test -x .build/release/tlc-validate
          mkdir -p .build/replay-result
          jq -n --arg source "$SWIFT_TLA_SHA" --arg evidence "$REPLAY_SHA" --arg run "$REPLAY_RUN_ID" \
            '{sourceSHA:$source,evidenceSHA:$evidence,evidenceRunID:$run,admission:false}' \
            > .build/replay-result/origin.json
          /usr/bin/time -l .build/release/tlc-validate compare run --case "$CASE_ID" \
            --native .build/replay-evidence/native --oracle .build/replay-evidence/oracle \
            --output .build/replay-result/comparison
          jq -e '.result == "exact" and .graphCompared == true' \
            ".build/replay-result/comparison/$CASE_ID/comparison.json"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: comparison-replay-${{ env.SWIFT_TLA_SHA }}-${{ github.run_id }}
          path: .build/replay-result
          if-no-files-found: error
