only_rules:
  - closing_brace
  - closure_end_indentation
  - closure_parameter_position
  - closure_spacing
  - colon
  - comma
  - comment_spacing
  - compiler_protocol_init
  - computed_accessors_order
  - control_statement
  - duplicate_imports
  - empty_enum_arguments
  - file_length
  - empty_parentheses_with_trailing_closure
  - function_body_length
  - function_parameter_count
  - identifier_name
  - large_tuple
  - line_length
  - nesting
  - type_body_length
  - empty_string
  - fatal_error_message
  - implicit_return
  - leading_whitespace
  - legacy_cggeometry_functions
  - legacy_constant
  - legacy_constructor
  - legacy_hashing
  - legacy_nsgeometry_functions
  - legacy_random
  - literal_expression_end_indentation
  - mark
  - no_space_in_method_call
  - opening_brace
  - orphaned_doc_comment
  - prefer_self_type_over_type_of_self
  - prefer_zero_over_explicit_init
  - protocol_property_accessors_order
  - reduce_into
  - redundant_discardable_let
  - redundant_nil_coalescing
  - redundant_objc_attribute
  - implicit_optional_initialization
  - redundant_self
  - redundant_set_access_control
  - redundant_string_enum_value
  - redundant_type_annotation
  - redundant_void_return
  - return_arrow_whitespace
  - shorthand_operator
  - statement_position
  - switch_case_alignment
  - syntactic_sugar
  - toggle_bool
  - trailing_comma
  - trailing_newline
  - trailing_semicolon
  - trailing_whitespace
  - unavailable_function
  - unneeded_break_in_switch
  - unneeded_parentheses_in_closure_argument

  - unused_closure_parameter
  - unused_control_flow_label
  - unused_enumerated
  - unused_import
  - unused_optional_binding
  - unused_setter_value
  - valid_ibinspectable
  - vertical_parameter_alignment
  - vertical_whitespace
  - void_return
  - weak_delegate

line_length:
  warning: 150
  ignores_comments: true
  ignores_function_declarations: true
  ignores_urls: true

type_body_length:
  warning: 400

file_length:
  warning: 800

function_body_length:
  warning: 175

function_parameter_count:
  warning: 9

identifier_name:
  min_length: 1
  allowed_symbols: "_"
  excluded:
    - Variable
    - Action
    - Invariant
    - LeadsTo
    - Eventually
    - AlwaysEventually
    - EventuallyAlways
    - WeakFairness
    - StrongFairness
    - SymmetricCollection
    - CollectionAction
    - DeadlockCheck
    - Symmetry
    - Constant
    - Definition
    - Theorem
    - Assume
    - Extends
    - Constraint
    - Recursive
    - Use
    - Import
    - DefineRecursive
    - RuntimeFunc
    - Operator
    - UseSpec
    - UseOp
    - ForEach
    - Always
    - SymmetryGroup
    - Value
    - ∈
    - ⊆
    - ∪
    - ∩
    - N
    - NP
    - M

large_tuple:
  warning: 4

nesting:
  type_level:
    warning: 2

excluded:
  - .githooks
  - Sources/SwiftTLADemo/App.swift
  # Build products, package checkouts, and generated sources are not authored code.
  - "**/.build/**"
  - "**/.swiftpm/**"
  - "**/checkouts/**"
  - "**/generated/**"
